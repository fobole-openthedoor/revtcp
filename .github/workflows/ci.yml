name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n deploy/macos/service.sh scripts/build-macos.sh scripts/build-release.sh
      - if: runner.os == 'macOS'
        run: plutil -lint deploy/macos/local.revtcp.client.plist
